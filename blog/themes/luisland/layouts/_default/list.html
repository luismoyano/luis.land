{{ define "main" }}
<section class="post-list">
  <h1 class="page-title">posts</h1>
  {{ range .Pages }}
  <article class="post-item">
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <h2 class="post-item-title">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h2>
    {{ with .Summary }}<p class="post-summary">{{ . | plainify | truncate 120 }}</p>{{ end }}
  </article>
  {{ else }}
  <p class="empty">Todavía no hay posts. Pronto.</p>
  {{ end }}
</section>
{{ end }}
