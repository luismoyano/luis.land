{{ define "main" }}
<article class="post">
  <header class="post-header">
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    <a href="{{ "/" | relURL }}" class="back-link">← todos los posts</a>
  </footer>
</article>
{{ end }}
